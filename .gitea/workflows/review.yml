name: AI Review (reusable)

# Reusable workflow: one Claude Code review per pull request or whole-repository audit,
# posted to Gitea. Called from each repository's .gitea/workflows/ai-review.yml, see
# examples/caller-ai-review.yml and the README.

on:
  workflow_call:
    inputs:
      mode:
        description: 'pr, comment or audit; empty derives the mode from the event'
        type: string
        default: ''
      model:
        description: 'opus or sonnet; empty means opus (or the model named in a /review comment)'
        type: string
        default: ''
      skip_authors:
        description: 'comma-separated PR authors whose PRs are not reviewed'
        type: string
        default: 'renovate,gitea-actions'
      exclude_paths:
        description: 'comma-separated globs removed from the checkout and the diff before the review'
        type: string
        default: ''
      max_diff_lines:
        description: 'above this many diff lines the model gets the file list instead of the diff'
        type: string
        default: '4000'
      ai_review_ref:
        description: 'ref of CICD/ai-review to take scripts and prompts from'
        type: string
        default: main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      # Read access to Infrastructure/infra for the infra usage digest (Ansible roles only)
      INFRA_READ_TOKEN:
        required: false

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      CLAUDE_CODE_VERSION: 2.1.311 # renovate: datasource=custom.claude-code depName=claude-code
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN || github.token }}
      GITHUB_API_URL: ${{ github.api_url }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out CICD/ai-review
        uses: actions/checkout@v7
        with:
          repository: CICD/ai-review
          ref: ${{ inputs.ai_review_ref }}
          path: ai-review
          persist-credentials: false

      - name: Decide whether to run
        id: gate
        env:
          EVENT_JSON: ${{ toJSON(github.event) }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          printf '%s' "$EVENT_JSON" > "${RUNNER_TEMP:-/tmp}/event.json"
          ai-review/scripts/gate.sh "${{ github.event_name }}" "${RUNNER_TEMP:-/tmp}/event.json" \
            "${{ inputs.skip_authors }}" "${{ github.repository }}" "${{ inputs.mode }}" "${{ inputs.model }}"

      - name: Check out the repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          path: repo
          ref: ${{ steps.gate.outputs.head_sha }}
          fetch-depth: 0
          # The model reads this tree; the job token must not sit in its .git/config.
          persist-credentials: false

      - name: Install Claude Code
        if: steps.gate.outputs.run == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Secret gate
        if: steps.gate.outputs.run == 'true'
        run: ai-review/scripts/secret-scan.sh tree repo "${{ inputs.exclude_paths }}" out

      # Earlier AI reviews and replies on the PR, read with the job token here because the review
      # step must not see it. Without them the review still runs, so nothing here fails the job.
      - name: Collect the earlier discussion
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.mode != 'audit'
        env:
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        run: ai-review/scripts/history.sh "$PR_NUMBER" out/history.md || echo "history.sh failed, reviewing without history"

      # How the owner's infrastructure uses the role: names, file locations and value types only
      # (scripts/infra-digest.py). The infra repository holds plaintext secrets, so its checkout lives
      # in a temporary directory outside the workspace and is deleted when this step ends, before the
      # model runs; the token goes to git through the environment, never the command line. Without
      # the token, for repositories that are not roles, or on any error the review runs without it.
      - name: Infra usage digest
        if: steps.gate.outputs.run == 'true'
        env:
          INFRA_READ_TOKEN: ${{ secrets.INFRA_READ_TOKEN }}
          BASE_SHA: ${{ steps.gate.outputs.base_sha }}
        run: |
          [[ -f repo/meta/main.yml ]] || { echo "not an Ansible role, no infra digest"; exit 0; }
          [[ -n ${INFRA_READ_TOKEN:-} ]] || { echo "no INFRA_READ_TOKEN, reviewing without the infra digest"; exit 0; }
          tmp=$(mktemp -d)
          trap 'git -C repo worktree remove --force "$tmp/role-base" 2> /dev/null; rm -rf "$tmp"' EXIT
          if (
            set -euo pipefail
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: token $INFRA_READ_TOKEN"
            git clone -q --depth 1 --filter=blob:none --sparse https://git.msqu.de/infrastructure/infra.git "$tmp/infra"
            git -C "$tmp/infra" sparse-checkout set --no-cone '/group_vars/' '/host_vars/' '/inventories/' '/*.yml'
            python3 -m venv "$tmp/venv"
            "$tmp/venv/bin/pip" install -q -r ai-review/scripts/requirements-digest.txt
            # The role as of the base commit for pull requests: the change must not choose which
            # infra variables the digest lists (audits read the default branch, already trusted).
            role=repo
            if [[ -n ${BASE_SHA:-} ]]; then
              git -C repo worktree add -q --detach "$tmp/role-base" "$BASE_SHA"
              role=$tmp/role-base
            fi
            "$tmp/venv/bin/python" ai-review/scripts/infra-digest.py "$role" "$tmp/infra" "${GITHUB_REPOSITORY#*/}" > out/infra.md
          ); then
            echo "infra digest: $(wc -c < out/infra.md) bytes"
          else
            echo "infra digest failed, reviewing without it"
            rm -f out/infra.md
          fi

      - name: Review
        if: steps.gate.outputs.run == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BASE_SHA: ${{ steps.gate.outputs.base_sha }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          BASE_REF: ${{ steps.gate.outputs.base_ref }}
          # Audits read the repository context from here, whatever ref they run on.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
          MAX_DIFF_LINES: ${{ inputs.max_diff_lines }}
          AI_REVIEW_DIR: ${{ github.workspace }}/ai-review
          # Only for the cost record in out/cost.json.
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
        run: |
          claude --version
          # The model's process must not see the job token (it is only needed to post).
          env -u GITEA_TOKEN ai-review/scripts/review.sh "${{ steps.gate.outputs.mode }}" "${{ steps.gate.outputs.model }}" repo out

      - name: Post the result
        if: steps.gate.outputs.run == 'true'
        env:
          MODE: ${{ steps.gate.outputs.mode }}
          MODEL: ${{ steps.gate.outputs.model }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
          # The run's cost estimate goes into the body as a hidden line (scripts/cost-report.sh).
          COST_FILE: out/cost.json
        run: |
          source ai-review/scripts/lib.sh
          if [[ "$MODE" == audit ]]; then
            label=$(ai-review/scripts/post.sh label-id ai-audit 5319e7)
            build_issue_payload out/review.json "$(date -u +%F)" "$MODEL" "$label" > out/issue.json
            ai-review/scripts/post.sh issue out/issue.json
          else
            build_pr_review_payload out/review.json "$HEAD_SHA" out/pr.diff "$MODEL" > out/review_payload.json
            ai-review/scripts/post.sh review "$PR_NUMBER" out/review_payload.json
          fi

      - name: Report the failure on the pull request
        if: failure() && steps.gate.outputs.run == 'true' && steps.gate.outputs.pr_number != ''
        env:
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          # A failed run that reached the model costs too.
          COST_FILE: out/cost.json
        run: |
          mkdir -p out
          if [[ -s out/skip-reason.txt ]]; then
            cp out/skip-reason.txt out/failure.md
          else
            echo "AI review failed, see run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > out/failure.md
          fi
          ai-review/scripts/post.sh comment "$PR_NUMBER" out/failure.md
